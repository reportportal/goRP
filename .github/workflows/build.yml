name: Build

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # govulncheck reports standard library vulnerabilities fixed in later patch releases,
          # so use the newest patch of the Go version in go.mod, not exactly go.mod's x.y.0.
          go-version: '1.27' # Keep in sync with the `go` directive in go.mod.
          check-latest: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Keep in sync with the golangci-lint version pinned in Taskfile.yml (GOLANG_CI var).
          version: v2.15.0
      # pkg/ginkgo is a separate Go module, so the steps above do not cover it.
      - name: golangci-lint (pkg/ginkgo)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: pkg/ginkgo
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: go.mod and go.sum are tidy (pkg/ginkgo)
        run: go mod tidy -diff
        working-directory: pkg/ginkgo
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows support of the test suite is not established yet: report, but don't block.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: task build
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -cover ./...
      # pkg/ginkgo is a separate Go module. Its tests start worker processes and use
      # TMPDIR, so they are not run on Windows yet.
      - name: Build (pkg/ginkgo)
        if: runner.os != 'Windows'
        run: task ginkgo:build
      - name: Vet (pkg/ginkgo)
        if: runner.os != 'Windows'
        run: task ginkgo:vet
      - name: Test (pkg/ginkgo)
        if: runner.os != 'Windows'
        run: task ginkgo:test
      # pkg/ginkgo requires a released goRP, so the steps above never compile it against the
      # code in this repository. This one does, through a temporary go.work.
      - name: Build and test (pkg/ginkgo) against this repository's pkg/gorp
        if: runner.os != 'Windows'
        run: task ginkgo:workspace
