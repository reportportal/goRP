name: Build

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27' # Keep in sync with the `go` directive in go.mod.
      - name: Install Task
        uses: arduino/setup-task@v2
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Keep in sync with the golangci-lint version pinned in Taskfile.yml (GOLANG_CI var).
          version: v2.13.1
          # Optional: show only new issues if it's a pull request. The default value is `false`.
          only-new-issues: false
      # Run build of the application
      - name: Run build
        run: task build

      # Run testing on the code
      - name: Run testing
        run: task test
